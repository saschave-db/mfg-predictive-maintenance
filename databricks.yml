bundle:
  name: mfg-predictive-maintenance

variables:
  catalog:
    description: Unity Catalog catalog that hosts the pdm_* schemas
    default: serverless_stable_am1uc2_catalog
  zerobus_sp_app_id:
    description: Application id of the Zerobus producer service principal
    default: 240a5501-f956-4282-a2a7-ccc7614683a7
  zerobus_endpoint:
    description: Zerobus server endpoint for this workspace
    default: 7474651880045550.zerobus.us-east-2.cloud.databricks.com

  lakebase_endpoint:
    description: Lakebase endpoint resource path
    default: projects/pdm-demo/branches/production/endpoints/primary
  lakebase_host:
    description: Lakebase endpoint hostname
    default: ep-autumn-paper-d8fiis3p.database.us-east-2.cloud.databricks.com
  model_version:
    description: UC model version served by the endpoint (the @champion version)
    default: "2"
  genie_space_id:
    description: Genie agent (space) id, created by tools/genie_deploy.py
    default: 01f1c10d662111078cd7326dff1774c6
  warehouse_id:
    description: SQL warehouse for Genie
    default: fb9bc265e9f4578a
  app_sp_client_id:
    description: Client id of the app's service principal (non-owner identity for governance proof)
    default: 2a9b01a6-1050-4c7d-b389-45351bf8e97b

include:
  - resources/*.yml

targets:
  # Not development mode: dev mode deploys pipelines as triggered, and the live demo needs a continuous pipeline.
  demo:
    default: true
    workspace:
      host: https://fevm-serverless-stable-am1uc2.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/demo
